name: Set up build environment
description: Installs Task, GNU Parallel and jq, sets up Buildx and exposes the GitHub Actions cache to it.

inputs:
  service:
    description: The service being built, used to decide whether to free up disk space.
    default: ''

runs:
  using: composite
  steps:
    - uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
      # Some of our services need a lot of free disk. We run this action to
      # free up some disk space, however it is slow, so we conditionally do
      # this only on those services that need it.
      if: inputs.service == 'opensearch' || inputs.service == 'dynamodb' || inputs.service == 'postgis' || inputs.service == 'node'
    - name: Install dependencies
      shell: bash
      run: sudo apt-get update
        && sudo apt-get install -y eatmydata
        && sudo ln -snf /usr/bin/eatmydata /usr/local/bin/apt-get
        && sudo apt-get install -y parallel jq curl
        && sudo apt-get clean
        && sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
    - name: Install Task
      uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      with:
        # Dependabot updates this action but not the Task version, so bump the
        # version and the checksum of task_linux_amd64.tar.gz by hand.
        version: 3.29.1
        checksum: f9f12518b0d9d1c6e43f6f1ed1f202127fbfa7ee4b882794ccb42a4bd05dbc9d
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    # Expose the actions cache url and token.
    # https://github.com/tonistiigi/go-actions-cache/blob/master/api.md#authentication
    - name: Expose GitHub Runtime
      uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
