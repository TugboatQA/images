name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      push:
        description: Push to Docker hub after build is complete.
        default: true
        type: boolean
      services:
        description: Space delimited string of services to build. If empty, all will be built.
        type: string
  schedule:
    - cron: '0 0 * * 6'

env:
  # If this changes, also update the if on the docs job. We unfortunately can't
  # use env.PUSH in the if there.
  PUSH: ${{ (inputs.push || github.event_name == 'schedule' || github.event_name == 'push') && 'true' || 'false' }}

jobs:
  matrix:
    name: Create service matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v3
      - id: set-matrix
        run: .github/workflows/gha-matrix.sh ${{ inputs.services }} >> $GITHUB_OUTPUT
  build:
    name: Build service
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup
        with:
          service: ${{ matrix.service }}
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build
        run: task -- ${{ matrix.service }}
        env:
          # Load the images into docker without pushing them, so they can be
          # tested first.
          PUSH: false
          # Modify the temp dir for Gnu Parallel to use the runner's temp dir.
          # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#runner-context
          TMPDIR: ${{ runner.temp }}
      - name: Test healthcheck
        run: task test -- ${{ matrix.service }}
      - name: Push
        if: env.PUSH == 'true'
        run: task push -- ${{ matrix.service }}
      # Record which images directories were pushed, so the docs job only
      # publishes docs for those.
      - name: Record pushed images
        if: env.PUSH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pushed"
          for dir in images/*/; do
            touch "$RUNNER_TEMP/pushed/$(basename "$dir")"
          done
      - uses: actions/upload-artifact@v4
        if: env.PUSH == 'true'
        with:
          name: pushed-${{ matrix.service }}
          path: ${{ runner.temp }}/pushed
  docs:
    name: Generate docs
    needs: build
    runs-on: ubuntu-latest
    # If the push portion of this logic changes, change env.PUSH logic as well.
    if: always() && (inputs.push || github.event_name == 'schedule' || github.event_name == 'push')
    steps:
      - name: Checkout TugboatQA/images
        uses: actions/checkout@v3
        with:
          path: images
      - uses: ./images/.github/actions/setup
      - name: Checkout TugboatQA/dockerfiles
        uses: actions/checkout@v3
        with:
          repository: TugboatQA/dockerfiles
          path: dockerfiles
      - name: Generate docs
        working-directory: images
        run: task generate && task prepare-docs
      - uses: actions/download-artifact@v4
        # With no pushed images there is nothing to download, and nothing to
        # update below.
        continue-on-error: true
        with:
          pattern: pushed-*
          merge-multiple: true
          path: pushed
      - name: Sync docs
        run: |
          # Leave the docs of images that were not pushed in this run as they
          # are, e.g. because their tests failed or they were not built.
          excludes=()
          for dir in images/images/*/; do
            image=$(basename "$dir")
            if ! [[ -e "pushed/$image" ]]; then
              echo "Not updating docs for $image: it was not pushed"
              excludes+=(--exclude "/$image/")
            fi
          done
          rsync -av \
            --delete \
            --exclude .git \
            --exclude LICENSE \
            --exclude README.md \
            --exclude '*/loaded' \
            --exclude '*/pushed' \
            "${excludes[@]}" \
            images/images/ dockerfiles/
      - name: Configure SSH Agent
        uses: webfactory/ssh-agent@d4b9b8ff72958532804b70bbe600ad43b36d5f2e
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Commit and push
        working-directory: dockerfiles
        run: |
          test "$PUSH" != "1" \
            && test "$PUSH" != "true" \
            && echo "Skipping push: PUSH=$PUSH" \
            && exit 0 \
            || echo "Pushing to TugboatQA/dockerfiles: PUSH=$PUSH"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add . && git diff --cached --exit-code || (git commit -m "$GITHUB_RUN_NUMBER" && git push)
